<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RE10 Sport</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }
    header {
      background: #101010;
      color: white;
      padding: 22px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 25px; font-weight: 900; }
    .logo span { color: #d6ff00; }
    nav { background: #202020; padding: 13px; text-align: center; }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-size: 13px;
    }
    .hero {
      background: #151515;
      color: white;
      padding: 55px 22px;
      text-align: center;
    }
    .hero h1 { font-size: 42px; margin: 0 0 15px; }
    .hero span { color: #d6ff00; }
    .hero p { color: #ccc; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: #d6ff00;
      color: #111;
      padding: 14px 24px;
      border: 0;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      margin-top: 12px;
    }
    .products { padding: 30px 16px; }
    .products h2 { text-align: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      background: white;
      padding: 12px;
      border-radius: 8px;
    }
    .picture {
      background: #e9e9e9;
      min-height: 125px;
      display: grid;
      place-items: center;
      font-size: 48px;
    }
    .card h3 { font-size: 15px; }
    .price { font-weight: bold; }
    .card button {
      width: 100%;
      padding: 11px 4px;
      background: #111;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #cart {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #d6ff00;
      padding: 13px;
      text-align: center;
      font-weight: bold;
    }
    footer {
      background: #101010;
      color: white;
      text-align: center;
      padding: 30px 15px 75px;
      margin-top: 25px;
    }
    @media (min-width: 650px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">RE<span>10</span> SPORT</div>
    <div>⚽ SHOP</div>
  </header>
  <nav>
    <a href="#home">HOME</a>
    <a href="#products">SHOP</a>
    <a href="#about">ABOUT</a>
  </nav>
  <section class="hero" id="home">
    <h1>BUILT TO <span>WIN.</span></h1>
    <p>Football essentials. Serious ambition.<br>YOUR GAME. YOUR FUTURE.</p>
    <a class="btn" href="#products">SHOP NOW →</a>
  </section>
  <section class="products" id="products">
    <h2>FOOTBALL ESSENTIALS</h2>
    <div class="grid" id="grid"></div>
  </section>
  <footer id="about">
    <h2>RE10 SPORT</h2>
    <p>IT'S WRITTEN.</p>
    <p>Train hard. Believe. Achieve.</p>
    <small>Online store concept · More coming soon</small>
  </footer>
  <div id="cart">🛒 CART: <span id="count">0</span> ITEMS</div>
  <script>
    const products = [
      ["Football Training T-Shirt","199 kr","👕"],
      ["Football Shin Guards","129 kr","🛡️"],
      ["Training Socks","79 kr","🧦"],
      ["Football Water Bottle","99 kr","🥤"],
      ["Training Shorts","179 kr","🩳"],
      ["Football Bag","249 kr","🎒"],
      ["Training Cones","89 kr","🔶"],
      ["Grip Socks","99 kr","🧦"]
    ];
    let count = 0;
    document.getElementById("grid").innerHTML = products.map((p,i) =>
      `<article class="card">
        <div class="picture">${p[2]}</div>
        <h3>${p[0]}</h3>
        <p class="price">${p[1]}</p>
        <button onclick="addToCart()">ADD TO CART</button>
      </article>`
    ).join("");
    function addToCart() {
      count++;
      document.getElementById("count").textContent = count;
    }
  </script>
</body>
</html>
